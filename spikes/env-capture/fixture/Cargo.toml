[package]
name = "env-capture-fixture"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone: not part of the breakbulk workspace.
[workspace]

[dependencies]
# pkg-config + system openssl (no vendoring)
openssl-sys = "0.9"
# cc-rs compiling C and assembly
ring = "0.17"
# bindgen (libclang) + pkg-config against system zstd
zstd-sys = { version = "2", default-features = false, features = ["bindgen", "pkg-config"] }
