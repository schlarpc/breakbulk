# Fast checks on every push to main and every pull request (#1): the Rust
# tests, clippy and rustfmt in both Cargo workspaces, and the flake checks
# listed in .github/fast-checks. Heavy checks (Windows SDK, wine, cross
# toolchains, the CentOS 7 container) and the opt-in `nix run .#test-*`
# scripts do not run on GitHub-hosted runners; run them locally.
#
# Built paths go to the FlakeHub cache (flakehub-cache-action), which needs
# the `id-token: write` permission. Pull requests from forks get no token
# and build without the cache.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: cargo test, clippy, fmt
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [".", "crates/breakbulk-drv"]
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: DeterminateSystems/flakehub-cache-action@main
      - name: cargo fmt --check
        working-directory: ${{ matrix.workspace }}
        run: nix develop "$GITHUB_WORKSPACE" -c cargo fmt --check
      - name: cargo clippy
        working-directory: ${{ matrix.workspace }}
        run: nix develop "$GITHUB_WORKSPACE" -c cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        working-directory: ${{ matrix.workspace }}
        run: nix develop "$GITHUB_WORKSPACE" -c cargo test --workspace

  checks:
    name: flake checks (fast)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: DeterminateSystems/flakehub-cache-action@main
      - name: nix build (.github/fast-checks)
        run: |
          grep -v '^#' .github/fast-checks \
            | sed 's|^|.#checks.x86_64-linux.|' \
            | xargs nix build --keep-going --no-link --print-build-logs

  # Lazy trees turn `builtins.fetchGit` results and the flake's own source
  # into virtual store paths. The checks below fetch a git source or compare
  # product references against the source view, so a virtual path leaking
  # into a derivation fails them. They run with the setting forced both
  # ways, because the runner's default can change with the Nix release. The
  # derivation paths must also agree: a leaked virtual path differs per
  # evaluation and between the settings.
  lazy-trees:
    name: git sources, lazy-trees ${{ matrix.lazy-trees }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lazy-trees: ["true", "false"]
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: DeterminateSystems/flakehub-cache-action@main
      - name: nix build with lazy-trees = ${{ matrix.lazy-trees }}
        run: |
          checks=(git-multi-workspace-fetched git-multi-workspace-fetched-reference products-source-paths)
          nix config show lazy-trees
          for c in "${checks[@]}"; do
            this=$(nix eval --raw --no-eval-cache --option lazy-trees ${{ matrix.lazy-trees }} ".#checks.x86_64-linux.$c.drvPath")
            other=$(nix eval --raw --no-eval-cache --option lazy-trees ${{ matrix.lazy-trees == 'true' && 'false' || 'true' }} ".#checks.x86_64-linux.$c.drvPath")
            if [ "$this" != "$other" ]; then
              echo "$c: derivation depends on lazy-trees: $this vs $other" >&2
              exit 1
            fi
          done
          printf '.#checks.x86_64-linux.%s\n' "${checks[@]}" \
            | xargs nix build --no-eval-cache --option lazy-trees ${{ matrix.lazy-trees }} --keep-going --no-link --print-build-logs

  # Lix has no lazy trees, and its `builtins.path` and `builtins.fetchGit`
  # are separate implementations of the calls `realTree` in lib/fetch.nix
  # relies on. Lix evaluates as a client of the runner's Nix daemon.
  lix:
    name: git sources, Lix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: DeterminateSystems/flakehub-cache-action@main
      - name: nix build with Lix
        run: |
          lix=$(nix build --no-link --print-out-paths --inputs-from . "nixpkgs#lix^out")
          checks=(git-multi-workspace-fetched git-multi-workspace-fetched-reference)
          for c in "${checks[@]}"; do
            ours=$("$lix/bin/nix" eval --raw --extra-experimental-features 'nix-command flakes' ".#checks.x86_64-linux.$c.drvPath")
            theirs=$(nix eval --raw ".#checks.x86_64-linux.$c.drvPath")
            if [ "$ours" != "$theirs" ]; then
              echo "$c: Lix evaluates a different derivation: $ours vs $theirs" >&2
              exit 1
            fi
          done
          printf '.#checks.x86_64-linux.%s\n' "${checks[@]}" \
            | xargs "$lix/bin/nix" build --extra-experimental-features 'nix-command flakes' --keep-going --no-link --print-build-logs
