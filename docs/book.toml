# The documentation site (mdBook), built by docs/default.nix as
# packages.<system>.docs-site and published to GitHub Pages by
# .github/workflows/pages.yml. src/reference/options/*.md are generated at
# build time from the module options (options-pages.py); do not add them.
[book]
title = "breakbulk"
language = "en"
src = "src"

[output.html]
git-repository-url = "https://github.com/schlarpc/breakbulk"
edit-url-template = "https://github.com/schlarpc/breakbulk/edit/main/docs/{path}"
site-url = "/breakbulk/"
additional-css = ["theme.css"]

# Nested chapters (the options pages, Internals) stay folded in the sidebar
# until you open their section, like a page's own headings.
[output.html.fold]
enable = true
level = 0
