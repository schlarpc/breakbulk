# Test-run options: `app`'s tests link the workspace
# library `util`, which has a README; `app`'s `data` test reads
# data/input.txt from its working directory, and its `notes` test reads
# notes.md, which `test.runFiles = [ "data" ]` leaves out.
[workspace]
resolver = "2"
members = ["util", "app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
