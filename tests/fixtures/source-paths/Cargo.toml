# Source paths and debug information ("Source paths and debug information"
# in docs/src/explanation/products.md): `app` ships a binary whose
# dependency `dep` panics and reports `file!()`, and which formats numbers
# with the registry crate `itoa`. The product's main output must not
# reference any source; its `debug` output references the sources a
# debugger needs. `dep` has unit tests and a README: editing the README
# must not change its test binary.
[workspace]
resolver = "2"
members = ["app", "dep"]

[workspace.package]
version = "0.1.0"
edition = "2021"

# split-debuginfo = "packed": DWARF in `app.dwp` next to the binary, which
# gdb must still find in the product's debug output (products-source-paths-dwp).
[profile.packed]
inherits = "dev"
split-debuginfo = "packed"

# split-debuginfo = "unpacked": DWARF in a `.dwo` per object file, of `dep`
# and `itoa` too, which gdb must find through the product's debug output
# (products-source-paths-dwo).
[profile.unpacked]
inherits = "dev"
split-debuginfo = "unpacked"
