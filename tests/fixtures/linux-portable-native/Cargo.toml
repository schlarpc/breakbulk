# linuxPortable with native libraries: openssl-sys, libz-sys and curl-sys
# find OpenSSL, zlib and libcurl with pkg-config (breakbulk's sysDefaults
# declare them). They come from the preset's package set, nixpkgs
# cross-built with zig cc against glibc 2.17 as static libraries, with
# libcurl's own libraries (nghttp2, zstd, …) from the same set, all linked
# into the product, which needs glibc 2.17 or older and nothing else.
[workspace]
resolver = "3"
members = ["app"]
