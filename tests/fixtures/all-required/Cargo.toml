# Decision 112: `tool`'s only bin needs a feature the default variant does
# not enable, so Cargo builds none of its binaries. In dynamic-derivation
# mode its product holds the no-binaries marker and every stage and check
# passes it on; IFD mode leaves it out of repo.checks.
[workspace]
resolver = "2"
members = ["app", "tool"]

[workspace.package]
version = "0.1.0"
edition = "2021"
