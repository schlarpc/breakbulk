# A second workspace in the same repository (like a `fuzz/` or `xtask/`
# workspace), with other values for the same inherited keys.
[workspace]
members = ["c", "d"]
resolver = "2"

[workspace.package]
version = "2.0.0"
edition = "2018"
readme = "TOOLS.md"
license = "MIT"
description = "tools workspace"

[workspace.dependencies]
d = { path = "d", version = "2.0.0", features = ["extra"] }

[workspace.lints.rust]
unsafe_code = "forbid"
