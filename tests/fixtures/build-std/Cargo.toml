# build-std (exploratory): a no_std x86_64-unknown-none kernel-style
# binary with core and compiler_builtins rebuilt from the nightly
# toolchain's rust-src (`-Zbuild-std`, from .cargo/config.toml).
[package]
name = "bare"
version = "0.1.0"
edition = "2024"
publish = false

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

