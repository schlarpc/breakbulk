# Tests of a cross test plan with a runner. `pmd` and `pmn` are proc
# macros: Cargo builds their unit tests and `pmd`'s doctest for the host
# and runs them there, not under the target's runner (`pmn`'s through
# nextest). `user`'s doctest and integration test use `pmd` and run for
# the target, under the runner.
[workspace]
resolver = "2"
members = ["pmd", "pmn", "user"]

[workspace.package]
version = "0.1.0"
edition = "2021"
